name: test
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with: { python-version: '3.11' }
    - name: Install
      run: |
        python -m pip install -r requirements-development.txt
    - name: Test
      run: |
        python -m pytest --doctest-modules
        ruff check .
        ruff format --check .
        mypy .
